<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Avatar Hablando</title>
<style>
  body {
    text-align: center;
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  #avatar {
    width: 300px;
    height: 300px;
    margin: 20px auto;
    background-image: url('gif.gif'); /* avatar animado */
    background-size: contain;
    background-repeat: no-repeat;
  }
</style>
</head>
<body>
<h1>Presiona la tecla "A" para escuchar al avatar</h1>

<div id="avatar" title="Avatar hablando"></div>

<audio id="audioAvatar" src="luvvoice.com-20251018-4lth00.mp3"></audio> <!-- Cambia por tu archivo de audio -->

<script>
  const audio = document.getElementById("audioAvatar");

  document.addEventListener("keydown", function(e){
    if(e.key.toLowerCase() === "a"){  // tecla "A"
      if(audio.paused){
        audio.play();
      } else {
        audio.pause();
      }
    }
  });
</script>
</body>
</html>
